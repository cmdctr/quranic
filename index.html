<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الباحث في القرآن الكريم</title>
    <link rel="preload" href="font/Amiri-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
  </head>
<body>
<div class="app">
    <div class="header">
        <h1>الباحث في القرآن</h1>
    </div>

    <div class="search">
        <input type="text" id="searchInput" placeholder="اكتب كلمة للبحث... (مثال: التوبة :التوبة +3)" autocomplete="off" autofocus>
        <button class="clear-btn" id="clearBtn" title="مسح البحث" aria-label="مسح البحث">✕</button>
    </div>

    <div class="stats hidden" id="stats">
        <span>النتائج <b id="totalOccurrences">٠</b></span>
        <span>الآيات <b id="totalVerses">٠</b></span>
        <span>السور <b id="totalSurahs">٠</b></span>
        <span class="scope-badge hidden" id="scopeBadge"></span>
    </div>

    <div id="resultsView">
        <ul class="results" id="resultsList"></ul>
    </div>

    <div id="contextView" class="hidden"></div>
</div>

<div class="pagination-wrapper hidden" id="paginationWrapper">
    <div class="pagination" id="pagination"></div>
</div>

<button class="scroll-btn" id="scrollBtn" title="التمرير إلى الأسفل" aria-label="التمرير">
    <svg id="scrollIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
</button>

<div id="toast" class="toast"></div>
</body>
</html>
